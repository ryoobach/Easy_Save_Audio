name: Build Easy Save Audio & Video (Windows x64)
# v2.2.3 adds MP3 stream/profile and per-channel diagnostics for Winamp compatibility investigation.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 새 커밋이 들어오면 이전 빌드를 취소하고 최신 소스만 빌드합니다.
concurrency:
  group: easy-save-audio-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create application icon
        run: python make_icon.py
      - name: Build Windows onedir application
        id: build
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path app_v2.py -Pattern '^APP_VERSION = "([^"]+)"'
          if (-not $versionMatch) { throw "APP_VERSION was not found in app_v2.py" }
          $version = $versionMatch.Matches[0].Groups[1].Value
          if ($version -ne "2.2.3") { throw "Expected version 2.2.3, found $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          # imageio-ffmpeg bundles ffmpeg.exe only. Download ffprobe.exe separately.
          $ffprobeZip = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials.zip"
          $ffprobeExtract = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffprobeZip
          Expand-Archive -Path $ffprobeZip -DestinationPath $ffprobeExtract -Force
          $ffprobeItem = Get-ChildItem -Path $ffprobeExtract -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          if (-not $ffprobeItem) { throw "ffprobe.exe was not found in the downloaded package." }
          $ffprobe = $ffprobeItem.FullName
          $appExe = "EasySaveAudioVideo_v$version"
          # onedir keeps the launcher EXE small and places runtime files in _internal.
          # UPX is intentionally disabled to avoid decompression overhead at startup.
          python -m PyInstaller --noconfirm --clean --onedir --contents-directory "_internal" --noupx --windowed --name $appExe --icon easy_save_audio.ico --add-data "easy_save_audio.png;." --add-data "easy_save_audio.ico;." --add-binary "$ffmpeg;." --add-binary "$ffprobe;." --collect-all yt_dlp --collect-all tkinterdnd2 app_v2.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller onedir build failed." }
          $appDir = "dist/$appExe"
          Copy-Item "Easy_Save_Audio_Video_기능설명서_v2.2.3.md" -Destination $appDir
          $exePath = "$appDir/$appExe.exe"
          $internalDir = "$appDir/_internal"
          if (-not (Test-Path $exePath)) { throw "Application executable was not created: $exePath" }
          if (-not (Test-Path $internalDir)) { throw "_internal directory was not created." }
          $zipName = "Easy_Save_Audio_Video_v$($version)_Windows_x64_Onedir.zip"
          Compress-Archive -Path $appDir -DestinationPath "dist/$zipName" -CompressionLevel Optimal -Force
          # Verify the package includes the launcher and the _internal runtime directory.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Join-Path (Get-Location) "dist/$zipName"))
          try {
            $entries = @($archive.Entries | Where-Object { -not $_.FullName.EndsWith("/") })
            $hasExe = @($entries | Where-Object { $_.FullName -eq "$appExe/$appExe.exe" }).Count -eq 1
            $hasInternal = @($entries | Where-Object { $_.FullName -like "$appExe/_internal/*" }).Count -gt 0
            $hasManual = @($entries | Where-Object { $_.FullName -eq "$appExe/Easy_Save_Audio_Video_기능설명서_v2.2.3.md" }).Count -eq 1
            if (-not $hasExe -or -not $hasInternal -or -not $hasManual) {
              throw "Onedir ZIP verification failed: launcher, _internal files, or feature manual are missing."
            }
          } finally {
            $archive.Dispose()
          }
          Write-Host "Created verified onedir package dist/$zipName"
          Write-Host "Launcher size: $((Get-Item $exePath).Length) bytes"
      - name: Upload Windows onedir ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Save-Audio-Video-v${{ steps.build.outputs.version }}-Windows-x64-Onedir
          path: dist/Easy_Save_Audio_Video_v${{ steps.build.outputs.version }}_Windows_x64_Onedir.zip
          if-no-files-found: error
