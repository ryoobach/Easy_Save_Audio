name: Build Easy Save Audio (Windows x64)
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create application icon
        run: python make_icon.py
      - name: Build portable EXE
        shell: pwsh
        run: |
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name EasySaveAudio --icon easy_save_audio.ico --add-data "easy_save_audio.png;." --add-data "easy_save_audio.ico;." --add-binary "$ffmpeg;." main.py
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Save-Audio-Windows-x64
          path: dist/EasySaveAudio.exe
          if-no-files-found: error
