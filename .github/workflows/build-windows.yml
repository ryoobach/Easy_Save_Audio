name: Build Easy Save Audio & Video (Windows x64)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 마지막 커밋 기준으로 빌드하며, 연속 수정 중에는 이전 빌드를 취소합니다.
concurrency:
  group: easy-save-audio-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Wait for 5 minutes of inactivity
        shell: pwsh
        run: Start-Sleep -Seconds 300
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install UPX executable compressor
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          $upx = (Get-Command upx.exe -ErrorAction SilentlyContinue).Source
          if (-not $upx) { throw "UPX installation failed; refusing to create an oversized package." }
          $upxDir = Split-Path $upx -Parent
          "UPX_DIR=$upxDir" >> $env:GITHUB_ENV
          Write-Host "UPX directory: $upxDir"
      - name: Create application icon
        run: python make_icon.py
      - name: Build compressed fast-start portable folder and versioned ZIP
        id: build
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path app_v2.py -Pattern '^APP_VERSION = "([^"]+)"'
          if (-not $versionMatch) { throw "APP_VERSION was not found in app_v2.py" }
          $version = $versionMatch.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          $appExe = "EasySaveAudioVideo_v$version"
          # onedir는 실행 시 전체 앱을 임시 폴더에 풀지 않습니다. UPX로 배포 용량을 줄입니다.
          python -m PyInstaller --noconfirm --clean --onedir --upx-dir "$env:UPX_DIR" --windowed --name $appExe --icon easy_save_audio.ico --add-data "easy_save_audio.png;." --add-data "easy_save_audio.ico;." --add-binary "$ffmpeg;." --collect-all yt_dlp --collect-all tkinterdnd2 app_v2.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed." }
          $zipName = "Easy_Save_Audio_Video_v$($version)_Windows_x64.zip"
          Compress-Archive -Path "dist/$appExe/*" -DestinationPath "dist/$zipName" -CompressionLevel Optimal -Force
          Write-Host "Created compressed fast-start package dist/$zipName"
      - name: Upload versioned Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Save-Audio-Video-v${{ steps.build.outputs.version }}-Windows-x64
          path: dist/Easy_Save_Audio_Video_v${{ steps.build.outputs.version }}_Windows_x64.zip
          if-no-files-found: error
