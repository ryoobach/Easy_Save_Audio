name: Build Easy Save Audio & Video (Windows x64)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 새 커밋이 들어오면 이전 대기/빌드를 취소하고 마지막 커밋 기준으로 다시 5분 대기합니다.
concurrency:
  group: easy-save-audio-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Wait for 5 minutes of inactivity
        shell: pwsh
        run: Start-Sleep -Seconds 300
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install UPX executable compressor
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          $upx = (Get-Command upx.exe -ErrorAction SilentlyContinue).Source
          if (-not $upx) {
            $candidate = Get-ChildItem "C:\\ProgramData\\chocolatey\\bin\\upx.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) { $upx = $candidate.FullName }
          }
          if ($upx) { "UPX_PATH=$upx" >> $env:GITHUB_ENV; Write-Host "UPX is available." }
          else { Write-Host "UPX unavailable; continuing with the standard build." }
      - name: Create application icon
        run: python make_icon.py
      - name: Build portable EXE and versioned ZIP
        id: build
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path app_v2.py -Pattern '^APP_VERSION = "([^"]+)"'
          if (-not $versionMatch) { throw "APP_VERSION was not found in app_v2.py" }
          $version = $versionMatch.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          $appExe = "EasySaveAudioVideo_v$version"
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name $appExe --icon easy_save_audio.ico --add-data "easy_save_audio.png;." --add-data "easy_save_audio.ico;." --add-binary "$ffmpeg;." --collect-all yt_dlp --collect-all tkinterdnd2 app_v2.py
          $zipName = "Easy_Save_Audio_Video_v$($version)_Windows_x64.zip"
          $packageDir = "dist/package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "dist/$appExe.exe" "$packageDir/$appExe.exe"
          Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/$zipName" -Force
          Write-Host "Created dist/$zipName with the versioned application"
      - name: Upload versioned Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Save-Audio-Video-v${{ steps.build.outputs.version }}-Windows-x64
          path: dist/Easy_Save_Audio_Video_v${{ steps.build.outputs.version }}_Windows_x64.zip
          if-no-files-found: error
