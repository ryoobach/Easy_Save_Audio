name: Build Easy Save Audio & Video (Windows x64)
# Build ten MP3 compatibility EXEs into one shared onedir application folder.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: easy-save-audio-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Create application icon
        run: python make_icon.py
      - name: Build ten profile executables into one folder
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path app_v2.py -Pattern '^APP_VERSION = "([^"]+)"'
          if (-not $versionMatch) { throw "APP_VERSION was not found in app_v2.py" }
          $version = $versionMatch.Matches[0].Groups[1].Value
          if ($version -ne "2.3.6") { throw "Expected version 2.3.6, found $version" }
          $baseSource = Get-Content app_v2.py -Raw
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          $ffprobeZip = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials.zip"
          $ffprobeExtract = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffprobeZip
          Expand-Archive -Path $ffprobeZip -DestinationPath $ffprobeExtract -Force
          $ffprobeItem = Get-ChildItem -Path $ffprobeExtract -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          if (-not $ffprobeItem) { throw "ffprobe.exe was not found." }
          $ffprobe = $ffprobeItem.FullName
          $profiles = @(
            "J_LAME_BASELINE", "K_RESERVOIR_ON", "L_NO_XING", "M_NO_ID3",
            "N_CBR_192K", "O_CBR_128K", "P_MONO_320K", "Q_MONO_192K",
            "R_VBR_Q2", "S_48KHZ"
          )
          $package = "dist/EasySaveAudioVideo_v$version-Winamp10"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $sharedRuntimeCopied = $false
          foreach ($profile in $profiles) {
            Write-Host "===== Building profile $profile ====="
            $sourceText = $baseSource.Replace('MP3_TEST_PROFILE = "BASELINE"', "MP3_TEST_PROFILE = `"$profile`"")
            if ($sourceText -eq $baseSource) { throw "Could not set MP3_TEST_PROFILE for $profile" }
            [System.IO.File]::WriteAllText((Join-Path (Get-Location) "app_v2.py"), $sourceText, [System.Text.UTF8Encoding]::new($false))
            $appExe = "EasySaveAudioVideo_v$version-$($profile.Substring(0,1))"
            $distPath = "build/profile-dist/$profile"
            $workPath = "build/profile-work/$profile"
            python -m PyInstaller --noconfirm --clean --onedir --contents-directory "_internal" --noupx --windowed --name $appExe --distpath $distPath --workpath $workPath --specpath "build/spec" --icon "$((Resolve-Path easy_save_audio.ico).Path)" --add-data "easy_save_audio.png;." --add-data "easy_save_audio.ico;." --add-binary "$ffmpeg;." --add-binary "$ffprobe;." --collect-all yt_dlp --collect-all tkinterdnd2 app_v2.py
            if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed for profile $profile" }
            $builtDir = Join-Path $distPath $appExe
            $builtExe = Join-Path $builtDir "$appExe.exe"
            if (-not (Test-Path $builtExe)) { throw "Missing executable for $profile" }
            Copy-Item $builtExe (Join-Path $package "EasySave_$($profile.Substring(0,1)).exe") -Force
            if (-not $sharedRuntimeCopied) {
              Copy-Item (Join-Path $builtDir "_internal") (Join-Path $package "_internal") -Recurse
              $sharedRuntimeCopied = $true
            }
          }
          Copy-Item "Easy_Save_Audio_Video_기능설명서_v2.3.6.md" -Destination $package
          $exeFiles = Get-ChildItem $package -Filter "EasySave_*.exe"
          if ($exeFiles.Count -ne 10) { throw "Expected 10 EXE files, found $($exeFiles.Count)" }
          if (-not (Test-Path (Join-Path $package "_internal"))) { throw "Shared _internal runtime folder is missing." }
          Add-Type -AssemblyName System.Drawing
          foreach ($exe in $exeFiles) {
            $associatedIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
            if ($null -eq $associatedIcon) { throw "Missing icon in $($exe.Name)" }
            $associatedIcon.Dispose()
          }
          $smoke = Start-Process -FilePath (Join-Path $package "EasySave_J.exe") -PassThru
          Start-Sleep -Seconds 8
          $smoke.Refresh()
          if ($smoke.HasExited) { throw "J executable exited during startup smoke test ($($smoke.ExitCode))." }
          Stop-Process -Id $smoke.Id -Force
          Write-Host "Ten executables and shared runtime folder verified."
      - name: Upload single shared application folder
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Save-Audio-Video-v2.3.6-Winamp10-Windows-x64
          path: dist/EasySaveAudioVideo_v2.3.6-Winamp10/
          if-no-files-found: error
